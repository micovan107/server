name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server Latest
      run: |
        mkdir server && cd server
        LATEST_URL=$(curl -s https://api.github.com/repos/Anuken/Mindustry/releases/latest | grep "browser_download_url" | grep "server-release.jar" | cut -d '"' -f 4)
        wget -O server.jar "$LATEST_URL"

    - name: Run Server & Playit Tunnel
      run: |
        # Tai playit binary
        wget -O playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
        chmod +x playit

        # Run Mindustry Server
        cd server
        echo "host" > commands.txt
        echo "config autosave true" >> commands.txt
        java -jar server.jar < commands.txt &
        cd ..

        # Chay playit va doi 5s cho in xong log
        ./playit --secret claim > playit.log 2>&1 &
        sleep 5

        echo "=========================================="
        echo "FULL LOG PLAYIT (CLICK LINK CLAIM TRONG NÀY):"
        cat playit.log
        echo "=========================================="

        while true; do
          sleep 60
          echo "[KEEP-ALIVE] Server active..."
        done
