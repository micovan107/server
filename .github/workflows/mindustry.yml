name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download Playit
      run: |
        PLAYIT_URL=$(curl -s https://api.github.com/repos/playit-cloud/playit-agent/releases/latest | grep "browser_download_url" | grep "linux-amd64" | cut -d '"' -f 4 | head -n1)
        wget -O playit "$PLAYIT_URL"
        chmod +x playit

    - name: Run Mindustry & Playit Auto Tunnel
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        # Chay playit ngam
        ./playit > playit.log 2>&1 &
        sleep 10

        echo "=========================================="
        echo "LOG PLAYIT:"
        cat playit.log
        echo "=========================================="

        wait
