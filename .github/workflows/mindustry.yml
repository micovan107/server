name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server Build 146
      run: |
        mkdir -p server/config/maps
        cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/download/v146/server-release.jar
        
        # Tải map từ mirror link raw chuẩn khác
        cd config/maps
        wget -O test.msav https://raw.githubusercontent.com/Anuken/Mindustry/v146/core/assets/maps/ancientCaldera.msav || true

    - name: Run Mindustry & Pinggy UDP Tunnel
      run: |
        cd server
        # Tạo file lệnh host map
        echo "reloadmaps" > commands.txt
        echo "host ancientCaldera survival" >> commands.txt
        echo "config autosave true" >> commands.txt
        
        java -jar server.jar < commands.txt &
        sleep 10
        cd ..

        # Chạy SSH Pinggy UDP
        ssh -o StrictHostKeyChecking=no -p 443 -R 0:127.0.0.1:6567 nKYs45w3a4n+udp@free.pinggy.io > pinggy.log 2>&1 &
        sleep 10

        echo "=========================================="
        echo "LOG CHI TIẾT PINGGY:"
        cat pinggy.log
        echo "=========================================="

        DOMAIN_PINGGY=$(grep -o '[a-z0-9-]*\.run\.pinggy-free\.link:[0-9]*' pinggy.log | head -n1)

        if [ -z "$DOMAIN_PINGGY" ]; then
          DOMAIN_PINGGY=$(grep -o '[a-z0-9-]*\.a\.pinggy\.io:[0-9]*' pinggy.log | head -n1)
        fi

        echo "=========================================="
        echo "DOMAIN KẾT NỐI VÀO GAME:"
        echo "$DOMAIN_PINGGY"
        echo "=========================================="

        while true; do
          sleep 60
          echo "[KEEP-ALIVE] Server Mindustry active..."
        done
