name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Setup Ngrok
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        wget -O ngrok.tgz https://bin.equinox.io/c/bMR2AQHvNVb/ngrok-v3-stable-linux-amd64.tgz
        tar -xf ngrok.tgz
        ./ngrok config add-authtoken $NGROK_AUTHTOKEN

    - name: Run Mindustry & Ngrok
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        ./ngrok tcp 6567 > ngrok.log 2>&1 &
        sleep 6

        # Lay Endpoint TCP
        URL=$(curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"tcp://[^"]*' | sed 's/"public_url":"tcp:\/\///')

        if [ -n "$URL" ]; then
          DOMAIN=$(echo $URL | cut -d: -f1)
          PORT=$(echo $URL | cut -d: -f2)
          IP_SO=$(getent ahosts $DOMAIN | awk '{print $1}' | head -n1)

          echo "=========================================="
          echo "ĐỊA CHỈ IP SỐ ĐỂ VÀO GAME MINDUSTRY:"
          echo "$IP_SO:$PORT"
          echo "=========================================="
        else
          echo "=========================================="
          echo "LỖI NGROK:"
          cat ngrok.log
          echo "=========================================="
        fi

        wait
