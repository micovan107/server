name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Get Playit Secret Key Automatically
      run: |
        mkdir server && cd server
        
        # 1. Tải Mindustry Server & Playit
        LATEST_URL=$(curl -s https://api.github.com/repos/Anuken/Mindustry/releases/latest | grep "browser_download_url" | grep "server-release.jar" | cut -d '"' -f 4)
        wget -O server.jar "$LATEST_URL"
        wget -O playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
        chmod +x playit

        # 2. Chạy Server Mindustry
        echo "host Fortress survival" > commands.txt
        echo "config autosave true" >> commands.txt
        java -jar server.jar < commands.txt &
        sleep 5

        # 3. Tạo Secret Key mới và in log
        ./playit reset-secret || true
        ./playit secret claim > playit.log 2>&1 &
        sleep 8

        echo "=========================================="
        echo "1. MỞ LINK NÀY BẰNG TRÌNH DUYỆT ĐỂ CLAIM:"
        grep -o 'https://playit.gg/claim/[^ ]*' playit.log || cat playit.log
        echo "=========================================="
        
        sleep 15
        
        echo "=========================================="
        echo "2. SECRET KEY CỦA ÔNG ĐÂY (COPY NGUYÊN DÒNG NÀY):"
        cat playit.toml 2>/dev/null || cat ~/.config/playit/playit.toml 2>/dev/null || echo "Chưa claim link ở trên!"
        echo "=========================================="

        while true; do
          sleep 60
          echo "[KEEP-ALIVE] Server active..."
        done
