name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Run Mindustry & Pinggy Tunnel
      run: |
        # Chay Mindustry server truoc
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        
        # Mo tunnel Pinggy
        ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:6567 tcp@a.pinggy.io > pinggy.log 2>&1 &
        
        # Doi 10 giây cho Pinggy bat tay va lay IP
        sleep 15
        
        echo "=========================================="
        echo "ĐỊA CHỈ IP ĐỂ VÀO GAME MINDUSTRY:"
        cat pinggy.log | grep -o 'a.pinggy.io:[0-9]*' || cat pinggy.log
        echo "=========================================="
        
        # Giu workflow khong bi thoat
        wait
