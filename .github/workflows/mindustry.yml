name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download Playit Old Version
      run: |
        wget -O playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
        chmod +x playit

    - name: Run Playit & Mindustry Server
      env:
        PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
      run: |
        if [ -n "$PLAYIT_SECRET_KEY" ]; then
          echo "=> Dang chay Playit voi Secret Key co dinh..."
          ./playit --secret $PLAYIT_SECRET_KEY &
        else
          echo "=> Chua co Secret Key, dang chay Playit tao Agent moi..."
          ./playit &
          sleep 3
          echo "=========================================="
          echo "MÃ SECRET KEY CỦA BẠN DƯỚI ĐÂY (COPY LƯU VÀO GITHUB SECRETS):"
          cat playit.toml || cat ~/.config/playit/playit.toml || true
          echo "=========================================="
        fi

        sleep 5
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival
