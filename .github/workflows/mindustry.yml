name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Install & Setup Ngrok
      env:
        NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install ngrok -y
        ngrok config add-authtoken $NGROK_AUTHTOKEN

    - name: Run Ngrok & Mindustry Server
      run: |
        ngrok tcp 6567 &
        sleep 5
        
        echo "=========================================="
        echo "ĐỊA CHỈ IP ĐỂ VÀO GAME MINDUSTRY:"
        curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"[^"]*' | sed 's/"public_url":"tcp:\/\///'
        echo "=========================================="

        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival
