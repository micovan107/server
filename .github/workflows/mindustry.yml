name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Install LocalXpose
      run: |
        wget -O loclx.zip https://api.localxpose.io/api/v2/downloads/loclx-linux-amd64.zip
        unzip loclx.zip
        chmod +x loclx

    - name: Run Mindustry & UDP Tunnel
      env:
        LOCAXPOSE_TOKEN: ${{ secrets.LOCAXPOSE_TOKEN }}
      run: |
        # Chạy Mindustry server
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        # Mở tunnel UDP kèm token trực tiếp
        ./loclx tunnel udp --to 127.0.0.1:6567 --token $LOCAXPOSE_TOKEN > loclx.log 2>&1 &
        sleep 8

        # Lấy endpoint và IP
        ENDPOINT=$(grep -o '[a-z0-9\.-]*\.loclx\.io:[0-9]*' loclx.log | head -n1)
        
        if [ -n "$ENDPOINT" ]; then
          DOMAIN=$(echo $ENDPOINT | cut -d: -f1)
          PORT=$(echo $ENDPOINT | cut -d: -f2)
          IP_SO=$(getent ahosts $DOMAIN | awk '{print $1}' | head -n1)

          echo "=========================================="
          echo "TÊN MIỀN UDP: $ENDPOINT"
          echo "ĐỊA CHỈ IP SỐ ĐỂ VÀO GAME: $IP_SO:$PORT"
          echo "=========================================="
        else
          echo "=========================================="
          echo "LỖI KẾT NỐI LOCLX:"
          cat loclx.log
          echo "=========================================="
        fi

        wait
