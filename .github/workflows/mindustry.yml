name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download Playit
      run: |
        curl -SsL https://playit-cloud.github.io/v0.4/pkg/bin/x86_64-unknown-linux-musl/playit -o playit
        chmod +x playit

    - name: Run Mindustry & Playit Auto Tunnel
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        # Chay playit ngam
        ./playit > playit.log 2>&1 &
        sleep 10

        # Lay claim URL neu chua link
        CLAIM_URL=$(grep -o 'https://playit.gg/claim/[a-zA-Z0-9]*' playit.log | head -n1)

        echo "=========================================="
        if [ -n "$CLAIM_URL" ]; then
          echo "BƯỚC CHUẨN BỊ (CHỈ LÀM 1 LẦN DUY NHẤT):"
          echo "Click vào link này để chấp nhận agent: $CLAIM_URL"
          echo "Sau đó add tunnel Custom UDP -> port 6567"
        else
          echo "LOG PLAYIT:"
          cat playit.log
        fi
        echo "=========================================="

        wait
