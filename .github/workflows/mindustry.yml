name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download Playit Old Version
      run: |
        wget -O playit https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-linux-amd64
        chmod +x playit

    - name: Run Playit & Mindustry Server
      run: |
        ./playit &
        sleep 5
        cd server
        # Tạo map mặc định tên 'world' chế độ survival rồi host luôn
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival
