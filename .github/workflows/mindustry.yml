name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download FRP Client
      run: |
        wget https://github.com/fatedier/frp/releases/download/v0.58.0/frp_0.58.0_linux_amd64.tar.gz
        tar -xf frp_0.58.0_linux_amd64.tar.gz
        mv frp_0.58.0_linux_amd64 frp

    - name: Run Mindustry & FRP UDP Tunnel
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        # Tao port ngau nhien va file config FRP
        RANDOM_PORT=$((RANDOM % 10000 + 20000))
        cat <<EOF > frpc.toml
        serverAddr = "free.vps.vc"
        serverPort = 7000

        [[proxies]]
        name = "mindustry-udp-$RANDOM_PORT"
        type = "udp"
        localIP = "127.0.0.1"
        localPort = 6567
        remotePort = $RANDOM_PORT
        EOF

        ./frp/frpc -c frpc.toml > frp.log 2>&1 &
        sleep 6

        # Lay IP so IPv4 cua server free.vps.vc
        FRP_IP=$(getent ahosts free.vps.vc | awk '{print $1}' | head -n1)

        echo "=========================================="
        echo "ĐỊA CHỈ IP SỐ UDP ĐỂ VÀO GAME MINDUSTRY:"
        echo "$FRP_IP:$RANDOM_PORT"
        echo "=========================================="

        wait
