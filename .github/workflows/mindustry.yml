name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server Latest (Build 159+)
      run: |
        mkdir server && cd server
        # Cao link tai file server-release.jar tu bản Release chính thức mới nhất
        SERVER_URL=$(curl -s https://api.github.com/repos/Anuken/Mindustry/releases/latest | grep "browser_download_url" | grep "server-release.jar" | cut -d '"' -f 4)
        wget -O server.jar "$SERVER_URL"

    - name: Run Mindustry & Pinggy UDP Tunnel
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        # Chạy SSH Pinggy dùng token UDP
        ssh -o StrictHostKeyChecking=no -p 443 -R 0:127.0.0.1:6567 nKYs45w3a4n+udp@free.pinggy.io > pinggy.log 2>&1 &
        sleep 10

        echo "=========================================="
        echo "LOG CHI TIẾT PINGGY:"
        cat pinggy.log
        echo "=========================================="

        DOMAIN_PINGGY=$(grep -o '[a-z0-9-]*\.run\.pinggy-free\.link:[0-9]*' pinggy.log | head -n1)

        if [ -z "$DOMAIN_PINGGY" ]; then
          DOMAIN_PINGGY=$(grep -o '[a-z0-9-]*\.a\.pinggy\.io:[0-9]*' pinggy.log | head -n1)
        fi

        echo "=========================================="
        echo "CỐP CÁI DOMAIN NÀY DÁN THẲNG VÀO GAME MINDUSTRY:"
        echo "$DOMAIN_PINGGY"
        echo "=========================================="

        while true; do
          sleep 60
          echo "[KEEP-ALIVE] Server Mindustry v159 vẫn đang chạy..."
        done
