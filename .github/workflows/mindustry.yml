name: Mindustry Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
    - name: Download Mindustry Server
      run: |
        mkdir server && cd server
        wget -O server.jar https://github.com/Anuken/Mindustry/releases/latest/download/server-release.jar

    - name: Download Bore
      run: |
        wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
        tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
        chmod +x bore

    - name: Run Mindustry & Bore Tunnel
      run: |
        cd server
        java -jar server.jar config autosave true &
        java -jar server.jar host Ancient_Caldera survival &
        cd ..

        ./bore local 6567 --to bore.pub > bore.log 2>&1 &
        sleep 5

        # Lay IP so IPv4 cua bore.pub
        BORE_IP=$(dig +short bore.pub | tail -n1)
        PORT=$(grep -o 'bore.pub:[0-9]*' bore.log | cut -d: -f2)

        echo "=========================================="
        echo "ĐỊA CHỈ IP SỐ ĐỂ VÀO GAME MINDUSTRY:"
        echo "$BORE_IP:$PORT"
        echo "=========================================="

        wait
